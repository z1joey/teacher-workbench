<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>密码重置验证码</title>
</head>
<body style="margin:0; padding:0; background:#f1f5ef;">
  <div style="max-width:520px; margin:0 auto; padding:32px 24px; font-family:-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,sans-serif;">
    <div style="background:#1b2a22; border-radius:12px 12px 0 0; padding:20px 28px;">
      <span style="color:#ffffff; font-size:18px; font-weight:600;">教师工作台</span>
    </div>
    <div style="background:#ffffff; border:1px solid #e3e9e2; border-top:0; border-radius:0 0 12px 12px; padding:28px;">
      <h1 style="margin:0 0 12px; font-size:18px; color:#1b2a22;">重置密码验证码</h1>
      <p style="margin:0 0 20px; font-size:14px; line-height:1.7; color:#4a5a51;">
        您（或有人）正在申请重置教师工作台账号的密码。请使用下面的验证码完成重置：
      </p>
      <div style="text-align:center; margin:0 0 20px;">
        <span style="display:inline-block; padding:12px 28px; background:#f1f5ef; border:1px solid #cfe0d4; border-radius:8px;
                     font-size:30px; font-weight:700; letter-spacing:8px; color:#2f5b44;">${code}</span>
      </div>
      <p style="margin:0 0 8px; font-size:14px; line-height:1.7; color:#4a5a51;">
        验证码 <strong>${minutes} 分钟内有效</strong>，超过有效时间请重新获取。
      </p>
      <p style="margin:0 0 20px; font-size:14px; line-height:1.7; color:#4a5a51;">
        如果这不是您本人的操作，请忽略本邮件，您的密码不会被更改。
      </p>
      <p style="margin:0; font-size:12px; color:#8a9a90;">
        本邮件由系统自动发送，请勿直接回复。
      </p>
    </div>
  </div>
</body>
</html>
