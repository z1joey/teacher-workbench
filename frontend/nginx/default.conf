# SPA + /api 反向代理，HTTP 与 HTTPS 各一份 server 块，路由逻辑保持一致。
# HTTPS 证书由宿主机 acme.sh 续期，写 /etc/letsencrypt/live/joeyzhang.me/，
# 由 docker-compose.yml 以只读方式挂进容器。

# 正式域名一律 301 升级到 HTTPS，浏览器地址栏才不会显示"不安全"；
# 续期用 standalone 模式（续期时 frontend 容器已停），不走 80 端口，不受影响
server {
    listen 80;
    server_name joeyzhang.me;
    return 301 https://joeyzhang.me$request_uri;
}

# default_server 兜底其它 Host（本地 localhost、IP 直连等），保持纯 HTTP，
# 避免开发时被 301 到带自签证书警告的 https
server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /gao/ {
        try_files $uri $uri/ /gao/index.html;
    }
    location = /gao { return 302 /gao/; }
    location = / { return 302 /gao/; }
}

server {
    listen 443 ssl;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/joeyzhang.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joeyzhang.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /gao/ {
        try_files $uri $uri/ /gao/index.html;
    }
    location = /gao { return 302 /gao/; }
    location = / { return 302 /gao/; }
}
