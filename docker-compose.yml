services:
  db:
    image: postgres:17
    container_name: teacher-workbench-db
    restart: unless-stopped
    # Credentials come from .env (see .env.example); compose fails fast with a
    # clear message when the file is missing. The port is published on the
    # loopback interface only, so host tools can reach the database without
    # exposing it on external network interfaces.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?missing - copy .env.example to .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?missing - copy .env.example to .env}
      - POSTGRES_DB=${POSTGRES_DB:?missing - copy .env.example to .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ 让 $ 由容器内 shell 展开，跟随实际的 POSTGRES_USER/DB，不硬编码
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    # 忘记密码验证码存储 + 限流计数；端口仅发布在回环地址供本地开发直连
    image: redis:7-alpine
    container_name: teacher-workbench-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 默认 z1joey/...:latest（本地开发构建标签）；CI 部署时 deploy.yml 通过
    # SSH 注入 DOCKERHUB_USERNAME 与 IMAGE_TAG，由这两个变量决定实际镜像
    image: ${DOCKERHUB_USERNAME:-z1joey}/teacher-workbench-backend:${IMAGE_TAG:-latest}
    container_name: teacher-workbench-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:?missing - copy .env.example to .env}:${POSTGRES_PASSWORD:?missing - copy .env.example to .env}@db:5432/${POSTGRES_DB:?missing - copy .env.example to .env}
      # 忘记密码验证码存 Redis；ALI_* 为阿里云 DirectMail 发信凭据（见 .env）
      - REDIS_URL=redis://redis:6379/0
      - ALI_ACCESS_KEY_ID=${ALI_ACCESS_KEY_ID:-}
      - ALI_ACCESS_KEY_SECRET=${ALI_ACCESS_KEY_SECRET:-}
      - ALI_NO_REPLY_EMAIL=${ALI_NO_REPLY_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 on purpose — deterministic, avoids localhost resolving to ::1
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-z1joey}/teacher-workbench-frontend:${IMAGE_TAG:-latest}
    container_name: teacher-workbench-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 on purpose: nginx only listens on IPv4, "localhost" would
      # resolve to ::1 inside the container and the check would always fail
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
    driver: local
