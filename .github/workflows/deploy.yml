# =============================================================================
# Teacher Workbench 自动化部署工作流
# =============================================================================
# 触发条件：推送到 main 分支（生产环境）或 develop 分支（开发环境）
# 部署流程：构建镜像 → 推送仓库 → SSH 部署到服务器
# =============================================================================

name: 构建并部署到服务器

on:
  push:
    branches: [main, develop]
  workflow_dispatch:  # 允许手动触发

# 环境变量：根据分支区分环境
env:
  # Docker 镜像仓库配置（默认使用 Docker Hub）
  DOCKER_REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

  # 后端镜像名称
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/teacher-workbench-backend
  # 前端镜像名称
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/teacher-workbench-frontend

jobs:
  # ===========================================================================
  # Job 1: 构建并推送 Docker 镜像
  # ===========================================================================
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 根据分支确定环境和镜像标签
      # -----------------------------------------------------------------------
      - name: 确定环境和标签
        id: env
        run: |
          # 根据分支名确定环境
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.prod.yml" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "tag=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.dev.yml" >> $GITHUB_OUTPUT
          fi

          # 完整镜像标签（带 commit SHA 用于版本追踪）
          echo "backend_tag=${{ env.BACKEND_IMAGE }}:${{ steps.env.outputs.tag }}" >> $GITHUB_OUTPUT
          echo "frontend_tag=${{ env.FRONTEND_IMAGE }}:${{ steps.env.outputs.tag }}" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # 配置 Docker Buildx（支持多平台构建和构建缓存）
      # -----------------------------------------------------------------------
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # 登录 Docker Hub（也可替换为阿里云容器镜像服务）
      # -----------------------------------------------------------------------
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 构建并推送后端镜像（使用层缓存加速）
      # -----------------------------------------------------------------------
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.env.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          # 启用构建缓存（GitHub Actions 缓存）
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # 构建并推送前端镜像（使用层缓存加速）
      # -----------------------------------------------------------------------
      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.env.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          # 启用构建缓存
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Job 2: 部署到服务器
  # ===========================================================================
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    # 仅 main 分支触发部署（develop 分支可手动触发）
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 检出代码（获取 docker-compose 文件）
        uses: actions/checkout@v4

      - name: 确定环境
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "tag=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # 通过 SSH 部署到服务器
      # -----------------------------------------------------------------------
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            # 切换到项目目录
            cd ${{ secrets.PROJECT_DIR }}

            echo "=========================================="
            echo "🚀 开始部署 Teacher Workbench"
            echo "环境: ${{ steps.env.outputs.environment }}"
            echo "镜像标签: ${{ steps.env.outputs.tag }}"
            echo "=========================================="

            # 1. 备份当前 .env 文件（如果存在）
            if [ -f .env ]; then
              echo "📦 备份 .env 文件..."
              cp .env .env.backup.$(date +%Y%m%d%H%M%S)
            fi

            # 2. 拉取最新镜像
            echo "📥 拉取最新镜像..."
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=${{ steps.env.outputs.tag }}

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/teacher-workbench-backend:${{ steps.env.outputs.tag }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/teacher-workbench-frontend:${{ steps.env.outputs.tag }}

            # 3. 优雅停止旧容器（零停机策略：先启动新容器，再停止旧容器）
            echo "🔄 执行优雅重启..."

            # 使用 docker compose 的 --remove-orphans 清理旧容器
            # 带环境变量的 docker-compose 命令
            POSTGRES_USER=${{ secrets.POSTGRES_USER }} \
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
            POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
            docker compose up -d --remove-orphans --force-recreate

            # 4. 等待服务健康检查通过
            echo "⏳ 等待服务启动..."
            sleep 10

            # 5. 检查服务状态
            echo "📊 服务状态："
            docker compose ps

            # 6. 清理悬空镜像（可选，节省磁盘空间）
            echo "🧹 清理旧镜像..."
            docker image prune -f --filter "until=24h"

            echo "=========================================="
            echo "✅ 部署完成！"
            echo "=========================================="

      # -----------------------------------------------------------------------
      # 部署后验证（可选）
      # -----------------------------------------------------------------------
      - name: 验证部署
        if: success()
        run: |
          echo "✅ 部署成功触发"
          echo "环境: ${{ steps.env.outputs.environment }}"
          echo "服务地址: http://${{ secrets.SERVER_HOST }}"
