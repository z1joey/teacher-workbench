# =============================================================================
# Teacher Workbench 生产环境部署工作流
# =============================================================================
# 触发方式：
#   1. PR 到 main      → 仅运行测试门禁（后端 pytest + 前端构建），不构建/部署
#   2. push 到 main    → 测试通过后构建推送 :latest + :sha-<sha>，自动部署
#                        生产服务器（部署 sha-<sha> 精确标签，不依赖浮动 latest）
#   3. 手动 workflow_dispatch（在 main 上运行）：
#      - 不填参数       → 重新构建并部署当前 commit 的 sha-<sha>
#      - 填写 image_tag → 跳过构建与测试，直接部署指定标签（回滚，如 sha-abc1234）
#
# 注意：GitHub Actions 只负责 production 环境；开发服务器的部署由本地脚本
# deploy-dev.sh 手动完成，不走本工作流。
# =============================================================================

name: 构建并部署到服务器

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: '部署指定镜像标签（如 sha-abc1234，用于回滚；留空则部署当前 commit 的 sha-<sha>）'
        required: false
        default: ''

# 本工作流不调用 GitHub API，令牌收紧为只读
permissions:
  contents: read

# 目标只有一台服务器，全局串行排队；部署进行中不允许并发插入
concurrency:
  group: teacher-workbench-deploy
  cancel-in-progress: false

env:
  # 后端 / 前端镜像名称（仓库名由 Secrets 决定）
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/teacher-workbench-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/teacher-workbench-frontend

jobs:
  # ===========================================================================
  # Job 1: 测试门禁 —— 后端 pytest
  # ===========================================================================
  # 生产部署的代码必须先过测试；回滚（手动触发且填了 image_tag）时跳过，
  # 避免紧急回滚被测试排队阻塞。
  test-backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Python 3.14（与镜像一致）
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖（运行时 + 测试）
        run: |
          pip install -r requirements.txt
          pip install pytest "httpx>=0.27"

      - name: 运行后端测试
        run: pytest -q

  # ===========================================================================
  # Job 2: 测试门禁 —— 前端构建
  # ===========================================================================
  test-frontend:
    name: 前端构建（vite build）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Node 22（与镜像一致）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行前端单元测试
        run: npm test

      - name: 构建前端产物
        run: npm run build

  # ===========================================================================
  # Job 3: 迁移冒烟 —— PostgreSQL 上真实执行迁移链（双向）
  # ===========================================================================
  # 单测全部走 SQLite（create_all 引导），0.1.2 的 0006 迁移在生产 PG 上首跑
  # 即崩、backend 崩溃循环。本任务在 PG17 上 upgrade → downgrade → 再 upgrade，
  # 挡住只对 SQLite 成立的迁移改动；并跑 GET /profile after demo seed，挡住
  # SELECT DISTINCT + ORDER BY json 这类 SQLite 放行、生产 PG 500 的查询。
  # 回滚部署（手动填 image_tag）时跳过。
  test-migrations-postgres:
    name: 迁移冒烟（PostgreSQL）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tw
          POSTGRES_PASSWORD: tw
          POSTGRES_DB: tw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Python 3.14（与镜像一致）
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest "httpx>=0.27"

      - name: 迁移链双向冒烟 + profile after demo seed
        env:
          # localhost 走端口映射，避免 GHA service 容器 DNS 偶发解析失败
          DATABASE_URL: postgresql+psycopg://tw:tw@127.0.0.1:5432/tw
          RUN_POSTGRES_TESTS: "1"
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          # SQLite pytest cannot catch DISTINCT + ORDER BY json; this is the
          # production GET /profile 500 after demo seed.
          pytest tests/test_profile_postgres.py -q

  # ===========================================================================
  # Job 4: 构建并推送 Docker 镜像（测试通过后才会执行）
  # ===========================================================================
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-backend, test-frontend, test-migrations-postgres]
    # 仅 main：push 事件正常构建；手动触发且未填 image_tag = 重新构建当前 commit；
    # 填了 image_tag = 只部署既有镜像（回滚），跳过构建。PR 事件不构建不推送镜像。
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.image_tag == ''))

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # -----------------------------------------------------------------------
      # 配置 Docker Buildx（支持构建缓存）
      # -----------------------------------------------------------------------
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # -----------------------------------------------------------------------
      # 登录 Docker Hub（也可替换为阿里云容器镜像服务）
      # -----------------------------------------------------------------------
      - name: 登录 Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 构建并推送后端镜像（层缓存按项目隔离，避免互相覆盖）
      # -----------------------------------------------------------------------
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # -----------------------------------------------------------------------
      # 构建并推送前端镜像
      # -----------------------------------------------------------------------
      - name: 构建并推送前端镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # -----------------------------------------------------------------------
      # 从 GHA 缓存载入到本地 daemon 并打包：deploy job 在另一台 runner 上，
      # 直接 pull 可能遇到 Hub 传播延迟或 manifest 尚未可见；artifact 传递更稳。
      # -----------------------------------------------------------------------
      - name: 载入镜像到本地并打包
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file ./backend/Dockerfile \
            --tag "${{ env.BACKEND_IMAGE }}:${IMAGE_TAG}" \
            --load \
            --cache-from type=gha,scope=backend \
            ./backend
          docker buildx build \
            --file ./frontend/Dockerfile \
            --tag "${{ env.FRONTEND_IMAGE }}:${IMAGE_TAG}" \
            --load \
            --cache-from type=gha,scope=frontend \
            ./frontend
          docker save \
            "${{ env.BACKEND_IMAGE }}:${IMAGE_TAG}" \
            "${{ env.FRONTEND_IMAGE }}:${IMAGE_TAG}" \
            | gzip > teacher-workbench-images.tar.gz
          du -sh teacher-workbench-images.tar.gz

      - name: 上传镜像包 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-images
          path: teacher-workbench-images.tar.gz
          retention-days: 1

  # ===========================================================================
  # Job 4: 部署到生产服务器
  # ===========================================================================
  deploy:
    name: 部署到服务器（production）
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 20
    # 仅 main：push 自动部署；手动触发用于回滚（填 image_tag）或重新部署当前 commit。
    # 构建成功才部署；回滚时 build-and-push 被跳过，但填了 image_tag 仍需执行。
    # production 环境分支策略已限定 main（受保护分支）；SERVER_*/POSTGRES_* 用环境级 Secrets。
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (
        needs.build-and-push.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')
      )
    environment: production

    steps:
      - name: 检出代码（获取 docker-compose.yml）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 确定部署标签
        id: meta
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            # 白名单校验：只放行 sha-* 或 latest，防止任意输入进入远端 shell
            if [[ ! "$INPUT_TAG" =~ ^sha-[0-9a-f]{7,40}$|^latest$ ]]; then
              echo "非法的 image_tag：$INPUT_TAG（仅允许 sha-<sha> / latest）" >&2
              exit 1
            fi
            tag="$INPUT_TAG"
          else
            # 部署本次 commit 构建推送的精确镜像，不依赖浮动的 latest
            tag="sha-${GIT_SHA}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 上传当前 commit 的 docker-compose.yml，保证服务器编排文件
      # 与本次部署的代码版本一致（服务器无需 git 拉取）
      # -----------------------------------------------------------------------
      - name: 上传 docker-compose.yml 到服务器
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ secrets.PROJECT_DIR }}
          overwrite: true

      # -----------------------------------------------------------------------
      # 正常部署：从 build-and-push 的 artifact 取镜像包（无需再 pull Hub）。
      # 回滚（手动填 image_tag）：构建被跳过，改在 runner 上 pull 后打包。
      # 服务器始终不直连 Docker Hub。
      # -----------------------------------------------------------------------
      - name: 下载构建产出的镜像包
        if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: deploy-images

      - name: 回滚时从 Docker Hub 拉取并打包
        if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          docker pull "$DOCKERHUB_USERNAME/teacher-workbench-backend:$IMAGE_TAG"
          docker pull "$DOCKERHUB_USERNAME/teacher-workbench-frontend:$IMAGE_TAG"
          docker save \
            "$DOCKERHUB_USERNAME/teacher-workbench-backend:$IMAGE_TAG" \
            "$DOCKERHUB_USERNAME/teacher-workbench-frontend:$IMAGE_TAG" \
            | gzip > teacher-workbench-images.tar.gz
          du -sh teacher-workbench-images.tar.gz

      - name: 上传镜像包到服务器
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: teacher-workbench-images.tar.gz
          target: ${{ secrets.PROJECT_DIR }}
          overwrite: true

      # -----------------------------------------------------------------------
      # 通过 SSH 部署：secrets 经环境变量传递，不在脚本里明文内插
      # -----------------------------------------------------------------------
      - name: 部署到服务器
        id: deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,PROJECT_DIR,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB
          script: |
            # ssh-action 新版已移除 script_stop 参数，出错即停由脚本自己保证
            set -euo pipefail
            cd "$PROJECT_DIR"

            echo "=========================================="
            echo "🚀 开始部署 Teacher Workbench (production)"
            echo "镜像标签: $IMAGE_TAG"
            echo "=========================================="

            # 1. 载入构建机传来的镜像包：load 保留仓库与 tag，载入后的镜像名
            #    与 compose 引用一致。服务器不再直连 Docker Hub。
            echo "📥 载入镜像包..."
            docker load -i "$PROJECT_DIR/teacher-workbench-images.tar.gz"
            rm -f "$PROJECT_DIR/teacher-workbench-images.tar.gz"

            # 2. 滚动更新
            #    - db 单独 up：配置未变化时不重建，避免每次部署重启数据库
            #    - --wait 等待容器通过自身 healthcheck，不健康则本步骤失败
            #    - --no-deps 只重建应用服务，不动 db
            echo "🔄 更新服务..."
            docker compose up -d --wait --wait-timeout 120 db redis
            docker compose up -d --wait --wait-timeout 300 --no-deps backend frontend

            echo "📊 服务状态："
            docker compose ps

            # 3. 端到端验证：健康检查含 DB ping；auth 读路径确认数据库查询可用
            echo "🩺 验证后端健康检查（含数据库）..."
            curl -fsS --max-time 10 http://127.0.0.1:8001/api/health
            echo "🩺 验证登录相关读路径..."
            curl -fsS --max-time 10 http://127.0.0.1:8001/api/auth/registration-status

            # 4. 清理悬空镜像（节省磁盘空间）
            echo "🧹 清理悬空镜像..."
            docker image prune -f --filter "until=24h" >/dev/null

            echo "=========================================="
            echo "✅ 部署完成"
            echo "=========================================="

      # -----------------------------------------------------------------------
      # 部署失败时导出服务器现场（容器状态 + backend/db 日志），避免每次
      # 都要登服务器排查。不用 set -e：某一项导出失败不影响其余项。
      # -----------------------------------------------------------------------
      - name: 失败时导出容器现场
        if: failure() && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: PROJECT_DIR
          script: |
            set -uo pipefail
            cd "${PROJECT_DIR:-.}"
            echo "==== docker compose ps ===="
            docker compose ps -a || true
            echo "==== backend logs (tail 100) ===="
            docker logs --tail 100 teacher-workbench-backend 2>&1 || true
            echo "==== db logs (tail 50) ===="
            docker logs --tail 50 teacher-workbench-db 2>&1 || true

      - name: 部署结果
        if: success()
        run: |
          echo "✅ 部署成功"
          echo "环境: production"
          echo "镜像标签: ${{ steps.meta.outputs.tag }}"
