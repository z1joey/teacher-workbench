# =============================================================================
# Teacher Workbench 生产环境部署工作流
# =============================================================================
# 触发方式：
#   1. push 到 main    → 构建推送 :latest + :sha-<sha>，自动部署生产服务器
#   2. push 到 develop → 仅构建推送 :dev-<sha> 镜像（归档/追溯用）
#   3. 手动 workflow_dispatch（在 main 上运行）：
#      - 不填参数       → 重新构建并部署 latest
#      - 填写 image_tag → 跳过构建，直接部署指定标签（回滚，如 sha-abc1234）
#
# 注意：development 环境（内网服务器，无公网出入，云端 runner 无法抵达）
# 的部署由本地脚本 deploy-dev.sh 完成，不在本工作流范围内。
# =============================================================================

name: 构建并部署到服务器

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: '部署指定镜像标签（如 sha-abc1234，用于回滚；留空则部署 latest）'
        required: false
        default: ''

# 本工作流不调用 GitHub API，令牌收紧为只读
permissions:
  contents: read

# 目标只有一台服务器，全局串行排队；部署进行中不允许并发插入
concurrency:
  group: teacher-workbench-deploy
  cancel-in-progress: false

env:
  # 后端 / 前端镜像名称（仓库名由 Secrets 决定）
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/teacher-workbench-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/teacher-workbench-frontend

jobs:
  # ===========================================================================
  # Job 1: 构建并推送 Docker 镜像
  # ===========================================================================
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 手动触发且填写了 image_tag = 只部署既有镜像（回滚），跳过构建
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # -----------------------------------------------------------------------
      # 根据分支 / 手动输入确定环境和镜像标签
      # -----------------------------------------------------------------------
      - name: 确定环境和标签
        id: meta
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$GIT_REF_NAME" == "main" ]]; then
            environment="production"
            tag="latest"
          else
            environment="development"
            tag="dev-${GIT_SHA}"
          fi
          {
            echo "environment=${environment}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 配置 Docker Buildx（支持构建缓存）
      # -----------------------------------------------------------------------
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # -----------------------------------------------------------------------
      # 登录 Docker Hub（也可替换为阿里云容器镜像服务）
      # -----------------------------------------------------------------------
      - name: 登录 Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 构建并推送后端镜像（层缓存按项目隔离，避免互相覆盖）
      # -----------------------------------------------------------------------
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # -----------------------------------------------------------------------
      # 构建并推送前端镜像
      # -----------------------------------------------------------------------
      - name: 构建并推送前端镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ===========================================================================
  # Job 2: 部署到生产服务器
  # ===========================================================================
  deploy:
    name: 部署到服务器（production）
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    # 仅 main：push 自动部署；手动触发用于回滚（填 image_tag）。
    # !cancelled()：回滚时构建任务被跳过，本任务仍需执行。
    # production 环境分支策略已限定 main；SERVER_*/POSTGRES_* 用环境级 Secrets。
    if: "${{ !cancelled() && github.ref == 'refs/heads/main' }}"
    environment: production

    steps:
      - name: 检出代码（获取 docker-compose.yml）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 确定部署标签
        id: meta
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="latest"
          fi
          {
            echo "environment=production"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 上传当前 commit 的 docker-compose.yml，保证服务器编排文件
      # 与本次部署的代码版本一致（服务器无需 git 拉取）
      # -----------------------------------------------------------------------
      - name: 上传 docker-compose.yml 到服务器
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ secrets.PROJECT_DIR }}
          overwrite: true

      # -----------------------------------------------------------------------
      # 通过 SSH 部署：secrets 经环境变量传递，不在脚本里明文内插
      # -----------------------------------------------------------------------
      - name: 部署到服务器
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          DEPLOY_ENV: ${{ steps.meta.outputs.environment }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: IMAGE_TAG,DEPLOY_ENV,DOCKERHUB_USERNAME,PROJECT_DIR,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB
          script_stop: true
          script: |
            cd "$PROJECT_DIR"

            echo "=========================================="
            echo "🚀 开始部署 Teacher Workbench"
            echo "环境: $DEPLOY_ENV"
            echo "镜像标签: $IMAGE_TAG"
            echo "=========================================="

            # 1. 拉取镜像（失败立即中止，不影响正在运行的服务）
            echo "📥 拉取镜像..."
            docker pull "$DOCKERHUB_USERNAME/teacher-workbench-backend:$IMAGE_TAG"
            docker pull "$DOCKERHUB_USERNAME/teacher-workbench-frontend:$IMAGE_TAG"

            # 2. 滚动更新
            #    - db 单独 up：配置未变化时不重建，避免每次部署重启数据库
            #    - --wait 等待容器通过自身 healthcheck，不健康则本步骤失败
            #    - --no-deps 只重建应用服务，不动 db
            echo "🔄 更新服务..."
            docker compose up -d --wait --wait-timeout 120 db
            docker compose up -d --wait --wait-timeout 300 --no-deps backend frontend

            echo "📊 服务状态："
            docker compose ps

            # 3. 端到端验证：从宿主机访问后端健康检查接口
            echo "🩺 验证后端健康检查..."
            curl -fsS --max-time 10 http://127.0.0.1:8001/api/health

            # 4. 清理悬空镜像（节省磁盘空间）
            echo "🧹 清理悬空镜像..."
            docker image prune -f --filter "until=24h" >/dev/null

            echo "=========================================="
            echo "✅ 部署完成"
            echo "=========================================="

      - name: 部署结果
        if: success()
        run: |
          echo "✅ 部署成功"
          echo "环境: ${{ steps.meta.outputs.environment }}"
          echo "镜像标签: ${{ steps.meta.outputs.tag }}"
